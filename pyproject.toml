[tool.poetry]
name = "proj-hh"
version = "0.1.0"
description = ""
authors = ["Ivan Glushenkov <glushman966@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"
psycopg2 = "^2.9.11"
requests = "^2.32.5"
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
python-dotenv = "^1.2.2"
mypy = "^1.19.1"
tabulate = "^0.10.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "isort (>=8.0.1,<9.0.0)",
    "black (>=26.3.0,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)"
]

[tool.black]
line_length = 119
exclude = ".git"

[tool.isort]
line_length = 119
force_single_line = true

[tool.mypy]
disallow_untyped_defs=true
warn_return_any=true
exclude = "venv"