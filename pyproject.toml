[tool.poetry]
name = "proj-hh"
version = "0.1.0"
description = ""
authors = ["Ivan Glushenkov <glushman966@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"
psycopg2 = "^2.9.11"
requests = "^2.32.5"
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
python-dotenv = "^1.2.2"
mypy = "^1.19.1"
tabulate = "^0.10.0"
flake8 = "^7.3.0"
black = "^26.5.1"
isort = "^9.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
skip-string-normalization = true
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
# максимальная длина строки
profile = "black"
line_length = 119
skip = [".venv", "venv"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
exclude = "venv/|.venv/|build/|dist/|.mypy_cache/"
